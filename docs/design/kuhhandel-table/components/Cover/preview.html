<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--felt-dark)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--felt-dark);font-family:var(--font-sans)}
.cv svg{position:absolute;inset:0}
.felt{fill:var(--felt)}.deep{fill:var(--felt-deep)}.acc{fill:var(--accent)}.pap{fill:var(--paper)}.cow{fill:var(--animal-cow)}.pig{fill:var(--animal-pig)}
.ol{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round}
.trk{fill:none;stroke:var(--line);stroke-width:10}.arc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.txt{position:absolute;left:40px;bottom:36px;width:440px}
.nm{margin:0;color:var(--paper);font-size:80px;line-height:.95;font-weight:800;letter-spacing:-.02em}
.tg{margin:12px 0 0;color:var(--muted);font-size:14px;line-height:19px}
</style></head><body><div class="cv">
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!--
blocks: felt slab 460×320 (radius-table 28) bleeding off top/right/bottom; felt-deep tray 400×84 (radius-lg 12); accent ring 72px.
arrangement: one tall table slab with satellites — the table, your hand tray, the countdown.
pattern: literal motif (banknote) — five 104×58 notes fanned across the tray, because money in your hand is what this redesign puts on screen; ink 3.5 outline = the art's own stroke.
steps & radii: gaps space-3 (8) / space-4 (12); notes radius-sm 6; slab radius-table 28; tray radius-lg 12; ring radius-pill.
-->
<rect class="felt" x="520" y="-20" width="460" height="328" rx="28"/>
<rect class="deep" x="548" y="176" width="400" height="84" rx="12"/>
<circle class="trk" cx="884" cy="76" r="36"/>
<path class="arc" d="M884 40 A36 36 0 1 1 848 76"/>
<g class="ol">
<rect class="pap" x="572" y="190" width="104" height="58" rx="6" transform="rotate(-8 624 219)"/>
<rect class="cow" x="636" y="182" width="104" height="58" rx="6" transform="rotate(-3 688 211)"/>
<rect class="acc" x="700" y="168" width="104" height="58" rx="6" transform="translate(0 -12)"/>
<rect class="pig" x="764" y="182" width="104" height="58" rx="6" transform="rotate(4 816 211)"/>
<rect class="pap" x="828" y="192" width="104" height="58" rx="6" transform="rotate(9 880 221)"/>
</g>
</svg>
<div class="txt"><h1 class="nm">Kuhhandel<br>Table</h1><p class="tg">Who is the game waiting on, and is it me? Answered at a glance.</p></div>
</div></body></html>
